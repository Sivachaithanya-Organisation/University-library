{% extends "base.html" %}
{% block title %}Add a Book — University Library{% endblock %}
{% block content %}
<h1 class="section-title">Add a New Book</h1>
<form class="add-form" method="post" action="{{ url_for('add_book') }}">
  <label>Title
    <input type="text" name="title" required>
  </label>
  <label>Author
    <input type="text" name="author" required>
  </label>
  <label>Category
    <select name="category" required>
      {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
    </select>
  </label>
  <label>Year
    <input type="number" name="year">
  </label>
  <label>Call Number
    <input type="text" name="call_number" placeholder="e.g. 004.5">
  </label>
  <label>Copies
    <input type="number" name="copies" value="1" min="1">
  </label>
  <label>Description
    <textarea name="description" rows="4"></textarea>
  </label>
  <button type="submit">Add to Catalog</button>
</form>
{% endblock %}
